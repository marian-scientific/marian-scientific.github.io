content="Got some exposure to laser cutting on the Muse3D at work. Made some personal engravings and tested various power setting and cut speeds. At 100% power even 100% speed is enough to cut thru 1/8-inch plywood.<br/><img style=\"max-width: 800px; height: auto;\" src=\"https://marian-scientific.github.io/journals/res/0006.jpg\">"