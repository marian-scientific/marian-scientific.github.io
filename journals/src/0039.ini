content="Designed and ordered 6x stepper motor driver PCBs from OSHPark to compare with against DKRed. See <a href=\"https://github.com/marian-scientific/projects/tree/Christ/03007%20-%20Axial%20Flux%20Stepper%20Motor/resources/circuit\">CAD files</a>. Submission was seamless, and they give better visibility into the order timeline. Pricing is comparable to DKRed. I decided not to expedite. [IMG 0039_A.png] </br> [IMG 0039_B.png] </br> [IMG 0039_C.png]"