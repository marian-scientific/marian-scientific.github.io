content="Printed several gear components. Manufacturing recommendation is to make the hole in the hour drive gear all the way thru the part and increase the inner diameter slightly (0.1mm) for better clearance with the minute shaft. Components were assembled and functionality was tested successfully. [IMG 0032.jpg]"