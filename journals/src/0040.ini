content="Snipped down main circuitboard to fit snuggly inside the box. Debugged minor soldering issue with one of the RGB LEDs. Wrote this <a href=\"https://github.com/marian-scientific/projects/tree/Christ/03008%20-%20xMM1/code/007_success_fail_effect\">code</a> to control the lights in unison with the buzzer depending on the reed switch status. <a href=\"https://www.youtube.com/shorts/KtAeSc_w-iE\">See video example.</a> </br> [IMG 0040.jpg]"