content="Printed additional mounting components and installed M3x4x5 heat-set inserts. One trick is to set them 75% in and then flip the part over and press it into the table; that gives the best surface finish. Installed reed switches and central chassis onto underside of box surface. Installed small magnet into plastic block for testing purposes only. [IMG 0027_A.jpg] </br> [IMG 0027_B.jpg] </br> [IMG 0027_C.jpg] </br> [IMG 0027_D.jpg] </br> [IMG 0027_E.jpg] 