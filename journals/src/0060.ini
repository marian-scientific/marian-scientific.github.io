content="Finished a likely buggy implementation of both the rp2040-USB-programmer and the PC-based hex file transmitter using python. <a href=\"https://github.com/marian-scientific/projects/tree/Christ/12001%20-%20RP2040%20AVR%20PCB/code\">See code directories 005 and 006.</a> The clock and data transmission works as expected, but for some reason the Atmega328P is completely unresponsive; no signal is being transmitted back over MISO. [IMG 0060.jpg]"