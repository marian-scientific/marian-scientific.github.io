content="Yesterday, I burned a bootloader on the atmega328P chip, which is now removed from the board shown below. [IMG 0080_A.jpg] </br>

I used an Arduino Uno to burn the bootloader and to upload the program to the atmega328P. This is the same program that was on the stm32 bluepill. 

Ofcourse there was a few things that were changed to accomodate the hardware change. Below is the assembled circuit without power. 

[IMG 0080_B.jpg] </br>

Unfortunately, The circuit is not operational. We don't need to use the logic leveler with this configuration but the circuit is not

operating as expected. There will be further tests using the digital oscilloscope to see if there's a signal output. Maybe the bit bashing isn't working
or maybe another microcontroller should be used. Options will be assessed. 