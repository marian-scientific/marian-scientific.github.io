content="After much debugging (2 days), I realized I had the Rset resistor on the MAX7219 jumping to GND instead of 5V. I thought for sure it was supposed to go to GND. Either way, we have <a href=\"https://github.com/marian-scientific/projects/tree/Christ/03008%20-%20xMM1/code/002_max7219_7segment_test\">this Atmega328P C code</a> to control a 7-segment display over what is essentially SPI.<br/><img style=\"max-width: 800px; height: auto;\" src=\"https://marian-scientific.github.io/journals/res/0007.jpg\"/>"