content="Drilled slot in box and mounted USB-C connector. Mounted, soldered, and heat-shrunk leads to all indicator LEDs and reed switches. Soldered additional JST sockets for the reed switches onto the main circuitboard. Glued box together. <a href=\"https://www.youtube.com/shorts/HvKcSeOrVio\">Tested magnetic field detection</a> with this <a href=\"https://github.com/marian-scientific/projects/tree/Christ/03008%20-%20xMM1/code/006_reed_switch_test\">C code</a>. [IMG 0036_A.jpg] </br> [IMG 0036_B.jpg] </br> [IMG 0036_C.jpg] </br> [IMG 0036_D.jpg] </br> [IMG 0036_E.jpg] </br> [IMG 0036_F.jpg] </br> [IMG 0036_G.jpg]"