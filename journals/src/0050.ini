content="Toyed around with the code for a while, but there is something amiss with the buzzer control timer and the rest of the control logic, so I implemented a buzzer-less version. Had to improve the solder connections, but everything fits in the box pretty well. Needs to be cleaned up slightly. <a href=\"https://www.youtube.com/shorts/joX_NOFaOQE\"See video of it in action.</a> [IMG 0050.jpg]"