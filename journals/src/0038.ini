content="I updated the web journal-generating <a href=\"https://github.com/marian-scientific/marian-scientific.github.io/blob/Christ/journals/genjournal.sh\">script</a> to categorize entries by submission month and reorganize the main page by project/author and the most-recent 10 entries. This is to improve page load times. A similar monthwise breakout eventually needs to be done at the author-level as well."