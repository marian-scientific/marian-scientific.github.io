content="Launched short-term investigation into developing a RP2040-based programmer for AVR ICSP-capable chips, especially the Atmega328P. After internal discusisons 2025-12-14, both of these chips seem to be the best avenues for future electronic project development. <a href=\"https://github.com/marian-scientific/projects/tree/Christ/12001%20-%20RP2040%20AVR%20PCB\">Completed first three preliminary tasks</a> establishing a functional Atmega328P and RP2040-zero toolchain to complete the remainder of the investigation."