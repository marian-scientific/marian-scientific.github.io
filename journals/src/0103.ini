content="A couple of days ago, I was tasked to create a PCB that esstially converts power from a USB-C to a firewire socket. A rough schematic was made and a 
custom footprint was created for the anticipated firewire female port. Yesterday, the Schematic was updated from a reference <a href=\"https://www.laskakit.cz/user/related_files/ch224ds1.pdf">workflow</a>
and is as shown, [IMG 0103_A.png] </b>

From the above link, configuration 6.1 was chosen (with the CH224K) on page 4. </b>

In preparation for the PCB layout, all components were prescribed footprints that were capable of being hand soldered and easily obtainable parts. But KiCAD
doesn't have a footprint for the IEEE1394 (firewire) female port. So a suitable part was researched for this project and one was found on mouser <a href=\"https://www.mouser.com/ProductDetail/Keystone-Electronics/929?qs=%252BeqmunvUw%2FUbMPBzGcSBTw%3D%3D">workflow</a>
and Digikey as well, <a href=\"https://www.digikey.com/en/products/detail/keystone-electronics/929/317308">workflow</a> . This is the 929 by Keystone Electronics. 

</b> This datasheet <a href=\"https://www.mouser.com/datasheet/3/201/1/929.pdf">workflow</a> was used to make a custom footprint for the 929. Here's the custom footprint 
I made [IMG 0103_B.png] </br>

Next time I anticipate to make the PCB design and have it looked over as well. 

"