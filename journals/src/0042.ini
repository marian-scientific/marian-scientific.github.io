content="Began to drill and counterbore mounting holes for the X-Y gantry plate. These slotting counterbore bits are really nice but get gummed up quickly and stall the motor of my weak drill press. Also have to use a cordless drill to reach the central holes. Would be nice to make a nice drill press. </br> [IMG 0042.jpg]"