content="Project complete 3 days early. Made final updates to the <a href=\"https://github.com/marian-scientific/projects/tree/Christ/03008%20-%20xMM1/code/008_full_project\">full project code</a> to fix the RNG and the intermittent failed 7-segment initialization. Also somehow the power draw is now high enough that it doesn't seem to automatically shut off the USB power bank, though the power bank still reads 100% after 3 days of testing. Designed a new 03008-010 input block with standoffs and a bigger grip area. <a href=\"https://github.com/marian-scientific/projects/tree/Christ/03008%20-%20xMM1/cad\">See latest CAD.</a> Printed two versions in new white PLA and applied the 'Alligreater' image (one mirrored) to the front with a glossy trasparent sticker. Will test this device with the children tomorrow. [IMG 0053_A.jpg] [IMG 0053_B.jpg] [IMG 0053_C.jpg]"