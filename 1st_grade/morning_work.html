<html>
	<head>
		<title>Morning Work Generator</title>
		<style>
@media print {
	body * {
		visibility: hidden;
	}
	#worksheet, #worksheet * {
		visibility: visible;
	}
	#worksheet {
		position: absolute;
		left: 0;
		top: 0;
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 0;
		border: none;
	}
}

@font-face {
	font-family: 'Dashed-Text';
	src: url('Trace-lxy0.ttf') format('truetype');
	font-weight: normal;
	font-style: normal;
	font-display: swap;
}

	.tracing-text {
		font-family:"Dashed-Text", "Comic Sans", "Comic Sans MS", cursive, sans-serif;
		color:"DarkGray";
		fill:"DarkGray";
	}
		</style>

		<script>

			function generate(){

				const currentDate= new Date();
				document.getElementById("worksheet_date").innerHTML=(currentDate.getMonth()+1)+"/ "+(currentDate.getDate())+"/ "+(currentDate.getFullYear());

				updateTracing();
				singleDigitAddition();

			}

			function toggleDate(){
				if (document.getElementById("dateToggle").checked==true){
					document.getElementById("worksheet_date").style.display="block";
				}
				else{
					document.getElementById("worksheet_date").style.display="none";
				}
			}

			function getNonCarryAdditionProblem(){

				num1=(Math.floor(Math.random()*9)+1);
				num2=(Math.floor(Math.random()*(10-num1)+1));
				return num1+" + "+num2+" =";

			}

			function singleDigitAddition(){
				document.getElementById("addition_simple_1_1").innerHTML=getNonCarryAdditionProblem();
				document.getElementById("addition_simple_1_2").innerHTML=getNonCarryAdditionProblem();
				document.getElementById("addition_simple_1_3").innerHTML=getNonCarryAdditionProblem();
				document.getElementById("addition_simple_2_1").innerHTML=getNonCarryAdditionProblem();
				document.getElementById("addition_simple_2_2").innerHTML=getNonCarryAdditionProblem();
				document.getElementById("addition_simple_2_3").innerHTML=getNonCarryAdditionProblem();

			}

			function updateTracing(){

				if(document.getElementById("textToTrace").value==""){
					document.getElementById("tracing_section").style.display="none";
				}
				else{
					document.getElementById("tracing_section").style.display="block";
					document.getElementById("worksheet_tracing").innerHTML=document.getElementById("textToTrace").value;
				}
			}
		</script>

	</head>

	<body onload="generate()">


		<div id="hide">
			<p>Show date: <input onclick="toggleDate()" type="checkbox" id="dateToggle" checked /></p>
			<p>Text to trace: <input onchange="updateTracing()" type="text" id="textToTrace" value="The _ cat _ is _ big ."/></p>
			<p><button onclick="window.print()">PRINT MORNING WORK</button></p>
		</div>


		<div id="worksheet">
			<svg viewBox="0 0 7.5 10.000" width="7.5in" height="10in" >
				<text x="0" y=".3" font-size=".3" fill="black" font-family="Comic Sans MS">Name:</text>
				<line x1="1" y1=".35" x2="3.5" y2=".35" stroke-width=".03" stroke="black"/>


				<text x="4" y=".3" font-size=".3" fill="black" font-family="Comic Sans MS">Date:</text>
				<line x1="4.8" y1=".35" x2="7.5" y2=".35" stroke-width=".03" stroke="black"/>
				<text id="worksheet_date" class="tracing-text" x="5.15" y=".29" font-size=".35"> </text>

			<g id="tracing_section">

				<line x1=".8" y1="1.25" x2="7" y2="1.25" stroke-width=".03" stroke="black"/>
				<line x1=".8" y1=".7" x2="7" y2=".7" stroke-width=".03" stroke="black"/>
				<line x1=".8" y1=".975" x2="7" y2=".975" stroke-width=".01" stroke="grey" stroke-dasharray=".1 .1"/>

				<text id="worksheet_tracing" class="tracing-text" x="1" y="1.2" font-size=".5"> </text>
			</g>

			<g id="single-digit-addition_section">
				<text id="addition_simple_1_1" x=".4" y="1.9" font-size=".5" fill="black" font-family="Comic Sans MS">1 + 5 =</text>
				<text id="addition_simple_1_2" x="3.0" y="1.9" font-size=".5" fill="black" font-family="Comic Sans MS">1 + 5 =</text>
				<text id="addition_simple_1_3" x="5.6" y="1.9" font-size=".5" fill="black" font-family="Comic Sans MS">1 + 5 =</text>
				<text id="addition_simple_2_1" x=".4" y="2.6" font-size=".5" fill="black" font-family="Comic Sans MS">1 + 5 =</text>
				<text id="addition_simple_2_2" x="3.0" y="2.6" font-size=".5" fill="black" font-family="Comic Sans MS">1 + 5 =</text>
				<text id="addition_simple_2_3" x="5.6" y="2.6" font-size=".5" fill="black" font-family="Comic Sans MS">1 + 5 =</text>
			</g>

			</svg>
		</div>
	</body>
</html>
